name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "pyinstaller>=6.9"  # PYINSTALLER_RESET_ENVIRONMENT (updater.relaunch)

    - name: Generate release tag
      id: tag
      run: |
        $date = Get-Date -Format "yyyy.MM.dd.HHmm"
        $tag = "v$date"
        echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
        echo "release_tag=$tag" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # The exe compares this with the latest release to update itself
    # (beam_profiler/updater.py); without it, it never updates.
    - name: Stamp the release into the build
      shell: bash
      run: |
        printf 'RELEASE = "%s"\nCOMMIT = "%s"\n' \
          "${{ steps.tag.outputs.release_tag }}" "$GITHUB_SHA" > beam_profiler/_build.py
        cat beam_profiler/_build.py

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --icon docs/icon.ico pylon_camera.py

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: pylon_camera-executable
        path: dist/pylon_camera.exe
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "Basler Camera Profiler ${{ steps.tag.outputs.release_tag }}"
        body: |
          ## Basler Beam Profiler Release

          **Built on:** ${{ steps.tag.outputs.release_tag }}
          **Commit:** ${{ github.sha }}

          ### What's New
          - Latest build of Basler Beam Profiler
          - Windows executable ready to use

          ### Download
          Download the `pylon_camera.exe` file below and run it directly on Windows.
        files: dist/pylon_camera.exe
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
